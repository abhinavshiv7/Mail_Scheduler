version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: email_scheduler
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    ports:
      - '8081:8080'
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/email_scheduler?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super-secret-key-for-dev
      - GOOGLE_CLIENT_ID=16507033663-d15evkve3n64kfu4ipdavvaf3gt8142j.apps.googleusercontent.com
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: sh -c "npx prisma db push && npm run start"

  frontend:
    build: ./frontend
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
