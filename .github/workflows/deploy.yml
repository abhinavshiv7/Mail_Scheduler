name: Deploy to GCP VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy using Docker Compose
    runs-on: ubuntu-latest
    environment: GCP_SECRETS

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create project directory and copy files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USERNAME }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          source: "."
          target: "~/reachinbox-app"
          rm: true

      - name: SSH into VM and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USERNAME }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          script: |
            cd ~/reachinbox-app
            
            # Rebuild and restart the containers in detached mode
            docker-compose up --build -d
            
            # Prune dangling images to prevent the VM disk from filling up
            docker image prune -f
