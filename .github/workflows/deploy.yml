name: Deploy to GCP VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy using Docker Compose
    runs-on: ubuntu-latest
    environment: GCP_SECRETS
    steps:
      - name: SSH into VM and deploy directly
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USERNAME }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ~/reachinbox-app
            cd ~/reachinbox-app
            
            # Use GITHUB_TOKEN to securely clone/pull the private repository without needing extra keys
            if [ -d ".git" ]; then
              echo "Repository exists. Pulling latest changes..."
              git pull https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main
            else
              echo "Repository not found. Cloning freshly..."
              git clone https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
            fi
            
            # Build and deploy the application
            docker-compose up --build -d
            
            # Prune dangling images to save space
            docker image prune -f
