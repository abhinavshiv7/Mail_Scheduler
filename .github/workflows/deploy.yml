name: Deploy to GCP VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy using Docker Compose
    runs-on: ubuntu-latest
    environment: GCP_SECRETS
    steps:
      - name: SSH into VM and deploy directly
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USERNAME }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ~/reachinbox-app
            cd ~/reachinbox-app
            
            # Clone or Pull
            if [ -d ".git" ]; then
              echo "Pulling latest changes..."
              git pull https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main
            else
              echo "Cloning repository..."
              git clone https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
            fi
            
            echo "Starting Docker containers..."
            # Try newer 'docker compose' plugin first, fallback to older 'docker-compose'
            if command -v docker-compose &> /dev/null; then
                docker-compose up --build -d
            elif docker compose version &> /dev/null; then
                docker compose up --build -d
            else
                echo "Neither docker-compose nor docker compose is installed!"
                exit 1
            fi
            
            docker image prune -f
